<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика котов</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #f0f0f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; padding: 30px 20px; margin-bottom: 30px; }
        h1 { font-size: 3rem; margin-bottom: 10px; color: #f8c291; }
        .stats-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; min-width: 200px; text-align: center; }
        .stat-card h3 { font-size: 2.5rem; color: #f8c291; margin-bottom: 5px; }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .search-box, .sort-select { padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(248,194,145,0.3); background: rgba(0,0,0,0.3); color: #f0f0f0; font-size: 1rem; }
        .cats-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.05); border-radius: 15px; overflow: hidden; margin-bottom: 40px; }
        .cats-table th { background: rgba(248,194,145,0.15); padding: 18px 15px; text-align: left; font-weight: 600; color: #f8c291; }
        .cats-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cats-table tr:hover { background: rgba(248,194,145,0.08); }
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 5px solid rgba(248,194,145,0.2); border-top: 5px solid #f8c291; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .chart-container { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; margin: 20px 0; }
        .prestige-badge { background: rgba(248,194,145,0.2); padding: 3px 10px; border-radius: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐱 Статистика котов</h1>
            <p>Данные с: http://78.40.188.120:3000/ | Автообновление: каждые 3 секунды</p>
        </header>
        
        <div class="stats-bar">
            <div class="stat-card"><h3 id="total-cats">0</h3><p>Всего котов</p></div>
            <div class="stat-card"><h3 id="total-users">0</h3><p>Пользователей</p></div>
            <div class="stat-card"><h3 id="avg-prestige">0</h3><p>Средний престиж</p></div>
            <div class="stat-card"><h3 id="last-update">-</h3><p>Обновлено</p></div>
        </div>
        
        <div class="chart-container">
            <h3>📊 Распределение престижей</h3>
            <canvas id="prestigeChart" height="100"></canvas>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchInput" placeholder="Поиск по имени или ID..." style="flex: 2;">
            <select class="sort-select" id="sortSelect" style="flex: 1;">
                <option value="cats_desc">Коты (↓)</option>
                <option value="cats_asc">Коты (↑)</option>
                <option value="prestige_desc">Престиж (↓)</option>
                <option value="prestige_asc">Престиж (↑)</option>
                <option value="attacks_desc">Атаки (↓)</option>
            </select>
            <select class="sort-select" id="filterSelect" style="flex: 1;">
                <option value="all">Все</option>
                <option value="prestige_1">Престиж 1+</option>
                <option value="prestige_2">Престиж 2+</option>
                <option value="has_inventory">С инвентарем</option>
            </select>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загрузка данных...</p>
        </div>
        
        <table class="cats-table" id="catsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Никнейм</th>
                    <th>Коты</th>
                    <th>Престиж</th>
                    <th>Атаки</th>
                    <th>Успешные</th>
                    <th>Матроскин</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://78.40.188.120:3000/';
        let allCats = [];
        let chart = null;
        let refreshInterval = 3000; // 3 секунды
        
        async function loadData() {
            try {
                const response = await fetch(API_URL + '?t=' + Date.now());
                const data = await response.json();
                
                // Преобразуем объект в массив
                allCats = Object.entries(data).map(([id, cat]) => ({
                    id,
                    name: cat.name || 'Без имени',
                    nickname: cat.nickname || 'Без ника',
                    cats: cat.cats || 0,
                    attacks: cat.attacks || 0,
                    successful_attacks: cat.successful_attacks || 0,
                    matroskin: cat.matroskin || 0,
                    prestige_level: cat.prestige_level || 0,
                    prestige_count: cat.prestige_count || 0,
                    total_prestige_bonus: cat.total_prestige_bonus || 0,
                    inventory: cat.inventory || {},
                    registered: cat.registered || null
                }));
                
                updateStats();
                updateChart();
                updateTable();
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
            }
        }
        
        function updateStats() {
            if (allCats.length === 0) return;
            
            const totalCats = allCats.reduce((sum, cat) => sum + cat.cats, 0);
            const avgPrestige = (allCats.reduce((sum, cat) => sum + cat.prestige_level, 0) / allCats.length).toFixed(1);
            
            document.getElementById('total-cats').textContent = totalCats.toLocaleString();
            document.getElementById('total-users').textContent = allCats.length;
            document.getElementById('avg-prestige').textContent = avgPrestige;
            document.getElementById('loading').style.display = 'none';
        }
        
        function updateChart() {
            const ctx = document.getElementById('prestigeChart').getContext('2d');
            const prestigeCounts = {};
            
            allCats.forEach(cat => {
                const level = cat.prestige_level;
                prestigeCounts[level] = (prestigeCounts[level] || 0) + 1;
            });
            
            const labels = Object.keys(prestigeCounts).sort((a,b) => a-b).map(l => `Уровень ${l}`);
            const data = Object.keys(prestigeCounts).sort((a,b) => a-b).map(l => prestigeCounts[l]);
            const colors = ['#a5b1c2', '#78e08f', '#4a69bd', '#f8c291', '#e55039', '#8e44ad'];
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }
        
        function updateTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const filter = document.getElementById('filterSelect').value;
            
            let cats = [...allCats];
            
            // Фильтрация
            if (filter === 'prestige_1') cats = cats.filter(c => c.prestige_level >= 1);
            if (filter === 'prestige_2') cats = cats.filter(c => c.prestige_level >= 2);
            if (filter === 'has_inventory') cats = cats.filter(c => Object.keys(c.inventory).length > 0);
            
            // Поиск
            if (search) {
                cats = cats.filter(c => 
                    c.name.toLowerCase().includes(search) ||
                    c.nickname.toLowerCase().includes(search) ||
                    c.id.includes(search)
                );
            }
            
            // Сортировка
            cats.sort((a, b) => {
                switch(sort) {
                    case 'cats_desc': return b.cats - a.cats;
                    case 'cats_asc': return a.cats - b.cats;
                    case 'prestige_desc': return b.prestige_level - a.prestige_level;
                    case 'prestige_asc': return a.prestige_level - b.prestige_level;
                    case 'attacks_desc': return b.attacks - a.attacks;
                    default: return 0;
                }
            });
            
            // Обновление таблицы
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            cats.forEach(cat => {
                const successRate = cat.attacks > 0 ? Math.round((cat.successful_attacks / cat.attacks) * 100) : 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small>${cat.id}</small></td>
                    <td><strong>${cat.name}</strong></td>
                    <td>${cat.nickname}</td>
                    <td><strong>${cat.cats.toLocaleString()}</strong></td>
                    <td><span class="prestige-badge">${cat.prestige_level}</span></td>
                    <td>${cat.attacks.toLocaleString()}</td>
                    <td>${cat.successful_attacks.toLocaleString()} <small>(${successRate}%)</small></td>
                    <td>${cat.matroskin.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        // Обработчики событий
        document.getElementById('searchInput').addEventListener('input', updateTable);
        document.getElementById('sortSelect').addEventListener('change', updateTable);
        document.getElementById('filterSelect').addEventListener('change', updateTable);
        
        // Автообновление
        loadData();
        setInterval(loadData, refreshInterval);
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>
</html>
