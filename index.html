<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐱 Cat Stats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Telegram Mini App стили */
        :root {
            --tg-theme-bg-color: #1a1a2e;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #f8c291;
            --tg-theme-button-text-color: #1a1a2e;
            --tg-theme-secondary-bg-color: #16213e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.4;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .container {
            max-width: 100%;
            padding: 16px;
            padding-bottom: 80px; /* Для кнопок внизу */
        }
        
        /* Хедер Telegram */
        .tg-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--tg-theme-secondary-bg-color);
            padding: 12px 16px;
            border-bottom: 1px solid rgba(248, 194, 145, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-button-color);
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tg-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--tg-theme-button-color);
        }
        
        /* Карточки */
        .card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(248, 194, 145, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-button-color);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Статистика вверху */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, rgba(248, 194, 145, 0.1), rgba(248, 194, 145, 0.05));
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--tg-theme-button-color);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Поиск и фильтры */
        .search-container {
            position: sticky;
            top: 60px;
            z-index: 50;
            background: var(--tg-theme-bg-color);
            padding: 12px 0;
        }
        
        .search-box {
            width: 100%;
            padding: 14px 16px;
            background: var(--tg-theme-secondary-bg-color);
            border: 1px solid rgba(248, 194, 145, 0.3);
            border-radius: 12px;
            color: var(--tg-theme-text-color);
            font-size: 16px;
            outline: none;
        }
        
        .search-box:focus {
            border-color: var(--tg-theme-button-color);
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        
        .filter-btn {
            padding: 10px 16px;
            background: rgba(248, 194, 145, 0.1);
            border: 1px solid rgba(248, 194, 145, 0.2);
            border-radius: 20px;
            color: var(--tg-theme-button-color);
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }
        
        .filter-btn.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-bg-color);
        }
        
        /* Диаграмма */
        .chart-container {
            height: 200px;
            margin: 8px 0;
            position: relative;
        }
        
        /* Список пользователей */
        .users-list {
            margin-top: 16px;
        }
        
        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid var(--tg-theme-button-color);
            transition: transform 0.2s;
        }
        
        .user-card:hover {
            transform: translateX(4px);
        }
        
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .user-name {
            font-weight: 600;
            font-size: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .user-prestige {
            background: rgba(248, 194, 145, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-theme-button-color);
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            font-size: 12px;
        }
        
        .stat-cell {
            text-align: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .stat-number {
            font-weight: 600;
            color: var(--tg-theme-button-color);
        }
        
        /* Кнопки внизу */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-secondary-bg-color);
            border-top: 1px solid rgba(248, 194, 145, 0.2);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 100;
        }
        
        .nav-btn {
            flex: 1;
            padding: 14px;
            background: rgba(248, 194, 145, 0.1);
            border: 1px solid rgba(248, 194, 145, 0.2);
            border-radius: 12px;
            color: var(--tg-theme-button-color);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .nav-btn.primary {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-bg-color);
        }
        
        /* Загрузка и ошибки */
        .loading {
            text-align: center;
            padding: 40px 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(248, 194, 145, 0.2);
            border-top-color: var(--tg-theme-button-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        
        /* Адаптив */
        @media (min-width: 768px) {
            .container {
                max-width: 500px;
                margin: 0 auto;
            }
            
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* Анимации */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Пулл ту рефреш */
        .pull-refresh {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Модальное окно с деталями */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        
        .modal.active .modal-content {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: var(--tg-theme-button-color);
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Telegram хедер -->
    <div class="tg-header">
        <button class="back-btn" onclick="Telegram.WebApp.close()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="tg-title">🐱 Cat Statistics</div>
        <div style="flex: 1"></div>
    </div>
    
    <div class="container">
        <!-- Основная статистика -->
        <div class="stats-grid fade-in">
            <div class="stat-item">
                <div class="stat-value" id="totalCats">0</div>
                <div class="stat-label">Всего котов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Игроков</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avgPrestige">0</div>
                <div class="stat-label">Ср. престиж</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="lastUpdate">--:--</div>
                <div class="stat-label">Обновлено</div>
            </div>
        </div>
        
        <!-- Карточка с диаграммой -->
        <div class="card fade-in">
            <div class="card-title">
                <i class="fas fa-chart-pie"></i> Распределение престижей
            </div>
            <div class="chart-container">
                <canvas id="prestigeChart"></canvas>
            </div>
        </div>
        
        <!-- Поиск и фильтры -->
        <div class="search-container">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск игрока...">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="prestige_2">Престиж 2+</button>
                <button class="filter-btn" data-filter="prestige_3">Престиж 3+</button>
                <button class="filter-btn" data-filter="top_cats">Топ по котам</button>
            </div>
        </div>
        
        <!-- Список игроков -->
        <div class="users-list" id="usersList">
            <!-- Будут загружаться динамически -->
        </div>
        
        <!-- Загрузка -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Загрузка данных...</div>
        </div>
        
        <!-- Ошибка -->
        <div class="error" id="error" style="display: none;">
            <h3><i class="fas fa-exclamation-triangle"></i> Ошибка</h3>
            <p id="errorText"></p>
            <button class="nav-btn" onclick="loadData()" style="margin-top: 12px;">
                <i class="fas fa-redo"></i> Повторить
            </button>
        </div>
        
        <!-- Pull to refresh индикатор -->
        <div class="pull-refresh" id="pullRefresh">
            <i class="fas fa-arrow-down"></i> Потяните для обновления
        </div>
    </div>
    
    <!-- Нижняя панель навигации -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="showTopPlayers()">
            <i class="fas fa-crown"></i> Топ
        </button>
        <button class="nav-btn primary" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> Обновить
        </button>
        <button class="nav-btn" onclick="showStats()">
            <i class="fas fa-chart-bar"></i> Статы
        </button>
    </div>
    
    <!-- Модальное окно с деталями игрока -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Детали игрока</h3>
                <button class="close-modal" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modalContent">
                <!-- Детали игрока будут здесь -->
            </div>
        </div>
    </div>
    
    <!-- Модальное окно со статистикой -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-chart-bar"></i> Детальная статистика</h3>
                <button class="close-modal" onclick="closeStatsModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="statsContent">
                <!-- Статистика будет здесь -->
            </div>
        </div>
    </div>

    <script>
        // Telegram Web App инициализация
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран
        tg.enableClosingConfirmation(); // Подтверждение закрытия
        
        // Конфигурация
        const API_URL = 'http://78.40.188.120:3000/';
        let playersData = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let chart = null;
        let refreshInterval = 5000; // 5 секунд
        let isRefreshing = false;
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            // Устанавливаем тему Telegram
            document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#1a1a2e');
            document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#f8c291');
            document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#1a1a2e');
            document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#16213e');
            
            // Показываем кнопку назад
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                tg.close();
            });
            
            // Настройка swipe для обновления
            setupSwipeRefresh();
            
            // Загружаем данные
            await loadData();
            
            // Автообновление
            setInterval(async () => {
                if (!isRefreshing) {
                    await loadData();
                }
            }, refreshInterval);
            
            // Инициализируем поиск
            setupSearch();
            
            // Инициализируем фильтры
            setupFilters();
        });
        
        // Настройка swipe для обновления
        function setupSwipeRefresh() {
            let startY = 0;
            let pullDist = 0;
            const pullRefresh = document.getElementById('pullRefresh');
            
            document.addEventListener('touchstart', e => {
                startY = e.touches[0].clientY;
            }, { passive: true });
            
            document.addEventListener('touchmove', e => {
                if (window.scrollY === 0) {
                    pullDist = e.touches[0].clientY - startY;
                    if (pullDist > 0) {
                        pullRefresh.style.transform = `translateY(${Math.min(pullDist, 100)}px)`;
                        pullRefresh.style.opacity = Math.min(pullDist / 100, 1);
                    }
                }
            }, { passive: true });
            
            document.addEventListener('touchend', async e => {
                if (pullDist > 100) {
                    pullRefresh.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Обновление...';
                    await loadData();
                    setTimeout(() => {
                        pullRefresh.innerHTML = '<i class="fas fa-check"></i> Обновлено!';
                        setTimeout(() => {
                            pullRefresh.innerHTML = '<i class="fas fa-arrow-down"></i> Потяните для обновления';
                        }, 1000);
                    }, 500);
                }
                pullDist = 0;
                pullRefresh.style.transform = 'translateY(0)';
                pullRefresh.style.opacity = '0.5';
            });
        }
        
        // Настройка поиска
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = searchInput.value.toLowerCase();
                    updatePlayersList();
                }, 300);
            });
        }
        
        // Настройка фильтров
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Убираем активный класс у всех кнопок
                    filterButtons.forEach(b => b.classList.remove('active'));
                    // Добавляем активный класс текущей кнопке
                    btn.classList.add('active');
                    // Устанавливаем фильтр
                    currentFilter = btn.dataset.filter;
                    updatePlayersList();
                });
            });
        }
        
        // Основная функция загрузки данных
        async function loadData() {
            if (isRefreshing) return;
            
            isRefreshing = true;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            
            try {
                console.log('🔄 Загружаю данные с:', API_URL);
                
                // Для Telegram Mini App можно делать прямые запросы
                const response = await fetch(API_URL, {
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Данные получены:', Object.keys(data).length, 'записей');
                
                // Сохраняем данные
                playersData = Object.entries(data).map(([id, player]) => ({
                    id,
                    name: player.name || 'Без имени',
                    nickname: player.nickname || 'Без ника',
                    cats: player.cats || 0,
                    attacks: player.attacks || 0,
                    successful_attacks: player.successful_attacks || 0,
                    matroskin: player.matroskin || 0,
                    prestige_level: player.prestige_level || 0,
                    prestige_count: player.prestige_count || 0,
                    total_prestige_bonus: player.total_prestige_bonus || 0,
                    inventory: player.inventory || {},
                    registered: player.registered || null
                }));
                
                // Обновляем интерфейс
                updateStats();
                updateChart();
                updatePlayersList();
                
                // Обновляем время
                const now = new Date();
                document.getElementById('lastUpdate').textContent = 
                    `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                // Показываем уведомление в Telegram
                tg.HapticFeedback.impactOccurred('light');
                
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                document.getElementById('errorText').textContent = error.message;
                document.getElementById('error').style.display = 'block';
                tg.HapticFeedback.notificationOccurred('error');
            } finally {
                loading.style.display = 'none';
                isRefreshing = false;
            }
        }
        
        // Обновление статистики
        function updateStats() {
            if (playersData.length === 0) return;
            
            const totalCats = playersData.reduce((sum, p) => sum + p.cats, 0);
            const avgPrestige = (playersData.reduce((sum, p) => sum + p.prestige_level, 0) / playersData.length).toFixed(1);
            const topPlayer = playersData.sort((a, b) => b.cats - a.cats)[0];
            
            document.getElementById('totalCats').textContent = formatNumber(totalCats);
            document.getElementById('totalUsers').textContent = playersData.length;
            document.getElementById('avgPrestige').textContent = avgPrestige;
        }
        
        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        // Обновление диаграммы престижей
        function updateChart() {
            const ctx = document.getElementById('prestigeChart').getContext('2d');
            
            // Считаем распределение по престижам
            const prestigeCounts = {};
            playersData.forEach(player => {
                const level = player.prestige_level;
                prestigeCounts[level] = (prestigeCounts[level] || 0) + 1;
            });
            
            // Сортируем уровни
            const sortedLevels = Object.keys(prestigeCounts).sort((a, b) => a - b);
            const labels = sortedLevels.map(l => `Ур. ${l}`);
            const data = sortedLevels.map(l => prestigeCounts[l]);
            
            // Цвета для диаграммы
            const colors = [
                'rgba(165, 177, 194, 0.8)',  // Серый для 0
                'rgba(120, 224, 143, 0.8)',  // Зеленый для 1
                'rgba(74, 105, 189, 0.8)',   // Синий для 2
                'rgba(248, 194, 145, 0.8)',  // Оранжевый для 3
                'rgba(229, 80, 57, 0.8)',    // Красный для 4
                'rgba(142, 68, 173, 0.8)'    // Фиолетовый для 5+
            ];
            
            // Уничтожаем старую диаграмму
            if (chart) {
                chart.destroy();
            }
            
            // Создаем новую диаграмму
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 1,
                        borderColor: 'rgba(255, 255, 255, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = Math.round((value / total) * 100);
                                    return `${label}: ${value} игроков (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '60%',
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });
        }
        
        // Обновление списка игроков
        function updatePlayersList() {
            const usersList = document.getElementById('usersList');
            
            if (playersData.length === 0) {
                usersList.innerHTML = `
                    <div class="error">
                        <i class="fas fa-users-slash"></i>
                        <p>Нет данных об игроках</p>
                    </div>
                `;
                return;
            }
            
            // Фильтрация и сортировка
            let filteredPlayers = [...playersData];
            
            // Применяем фильтр
            switch (currentFilter) {
                case 'prestige_2':
                    filteredPlayers = filteredPlayers.filter(p => p.prestige_level >= 2);
                    break;
                case 'prestige_3':
                    filteredPlayers = filteredPlayers.filter(p => p.prestige_level >= 3);
                    break;
                case 'top_cats':
                    filteredPlayers.sort((a, b) => b.cats - a.cats);
                    filteredPlayers = filteredPlayers.slice(0, 20);
                    break;
            }
            
            // Применяем поиск
            if (searchQuery) {
                filteredPlayers = filteredPlayers.filter(p =>
                    p.name.toLowerCase().includes(searchQuery) ||
                    p.nickname.toLowerCase().includes(searchQuery) ||
                    p.id.includes(searchQuery)
                );
            }
            
            // Сортировка по умолчанию (по количеству котов)
            if (currentFilter !== 'top_cats') {
                filteredPlayers.sort((a, b) => b.cats - a.cats);
            }
            
            // Ограничиваем показ для производительности
            const displayPlayers = filteredPlayers.slice(0, 50);
            
            // Генерируем HTML
            let html = '';
            displayPlayers.forEach((player, index) => {
                const successRate = player.attacks > 0 
                    ? Math.round((player.successful_attacks / player.attacks) * 100) 
                    : 0;
                
                html += `
                    <div class="user-card fade-in" onclick="showPlayerDetails('${player.id}')" 
                         style="animation-delay: ${index * 0.05}s;">
                        <div class="user-header">
                            <div class="user-name">
                                ${player.name}
                                <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">
                                    ${player.nickname}
                                </div>
                            </div>
                            <div class="user-prestige">
                                Престиж: ${player.prestige_level}
                            </div>
                        </div>
                        <div class="user-stats">
                            <div class="stat-cell">
                                <div class="stat-number" style="color: #f8c291;">
                                    ${formatNumber(player.cats)}
                                </div>
                                <div>котов</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-number" style="color: ${successRate >= 50 ? '#78e08f' : '#e55039'}">
                                    ${successRate}%
                                </div>
                                <div>успеха</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-number" style="color: #4a69bd;">
                                    ${formatNumber(player.matroskin)}
                                </div>
                                <div>матроскин</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            usersList.innerHTML = html;
            
            // Если нет результатов поиска
            if (filteredPlayers.length === 0) {
                usersList.innerHTML = `
                    <div class="error">
                        <i class="fas fa-search"></i>
                        <p>По запросу "${searchQuery}" ничего не найдено</p>
                    </div>
                `;
            }
        }
        
        // Показать детали игрока
        function showPlayerDetails(playerId) {
            const player = playersData.find(p => p.id === playerId);
            if (!player) return;
            
            tg.HapticFeedback.impactOccurred('light');
            
            const inventoryItems = player.inventory ? Object.keys(player.inventory).length : 0;
            const successRate = player.attacks > 0 
                ? Math.round((player.successful_attacks / player.attacks) * 100) 
                : 0;
            
            document.getElementById('modalTitle').textContent = player.name;
            document.getElementById('modalContent').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                        <div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">ID игрока</div>
                            <div style="font-family: monospace; font-size: 14px;">${player.id}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Никнейм</div>
                            <div>${player.nickname}</div>
                        </div>
                    </div>
                    
                    <div style="background: rgba(248, 194, 145, 0.1); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
                        <div style="font-size: 14px; color: rgba(255, 255, 255, 0.8); margin-bottom: 8px;">
                            <i class="fas fa-crown"></i> Престиж
                        </div>
                        <div style="display: flex; gap: 16px;">
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #f8c291;">
                                    ${player.prestige_level}
                                </div>
                                <div style="font-size: 12px;">уровень</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #78e08f;">
                                    ${player.prestige_count}
                                </div>
                                <div style="font-size: 12px;">количество</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #4a69bd;">
                                    ${player.total_prestige_bonus}
                                </div>
                                <div style="font-size: 12px;">бонус</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px;">
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 20px; font-weight: bold; color: #f8c291;">
                                ${formatNumber(player.cats)}
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Коты</div>
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 20px; font-weight: bold; color: #4a69bd;">
                                ${formatNumber(player.matroskin)}
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Матроскин</div>
                        </div>
                    </div>
                    
                    <div style="background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
                        <div style="font-size: 14px; color: rgba(255, 255, 255, 0.8); margin-bottom: 8px;">
                            <i class="fas fa-crosshairs"></i> Статистика атак
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Всего атак:</span>
                            <span style="font-weight: bold;">${player.attacks}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Успешные:</span>
                            <span style="font-weight: bold; color: #78e08f;">${player.successful_attacks}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>Процент успеха:</span>
                            <span style="font-weight: bold; color: ${successRate >= 50 ? '#78e08f' : '#e55039'}">
                                ${successRate}%
                            </span>
                        </div>
                    </div>
                    
                    ${inventoryItems > 0 ? `
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 16px;">
                            <div style="font-size: 14px; color: rgba(255, 255, 255, 0.8); margin-bottom: 8px;">
                                <i class="fas fa-backpack"></i> Инвентарь (${inventoryItems} предметов)
                            </div>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${Object.entries(player.inventory).map(([item, details]) => `
                                    <span style="
                                        background: rgba(248, 194, 145, 0.2);
                                        padding: 6px 12px;
                                        border-radius: 16px;
                                        font-size: 12px;
                                    ">
                                        ${formatItemName(item)}: ${typeof details === 'object' ? details.count || 1 : details}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('playerModal').classList.add('active');
        }
        
        // Форматирование названий предметов
        function formatItemName(item) {
            const names = {
                'machine_gun': 'Пулемет',
                'hydrogen_bomb': 'Водородная бомба',
                'concentration_camp': 'Концлагерь',
                'ass_glue': 'Клей',
                'bark_pants': 'Кора-штаны',
                'trap': 'Ловушка'
            };
            return names[item] || item;
        }
        
        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('playerModal').classList.remove('active');
            tg.HapticFeedback.impactOccurred('light');
        }
        
        // Показать топ игроков
        function showTopPlayers() {
            tg.HapticFeedback.impactOccurred('light');
            currentFilter = 'top_cats';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === 'top_cats') {
                    btn.classList.add('active');
                }
            });
            updatePlayersList();
        }
        
        // Показать статистику
        function showStats() {
            tg.HapticFeedback.impactOccurred('light');
            
            if (playersData.length === 0) return;
            
            // Рассчитываем статистику
            const totalCats = playersData.reduce((sum, p) => sum + p.cats, 0);
            const totalAttacks = playersData.reduce((sum, p) => sum + p.attacks, 0);
            const totalSuccessful = playersData.reduce((sum, p) => sum + p.successful_attacks, 0);
            const totalMatroskin = playersData.reduce((sum, p) => sum + p.matroskin, 0);
            const avgPrestige = (playersData.reduce((sum, p) => sum + p.prestige_level, 0) / playersData.length).toFixed(2);
            
            const successRate = totalAttacks > 0 ? Math.round((totalSuccessful / totalAttacks) * 100) : 0;
            
            // Топ игроки
            const topByCats = [...playersData].sort((a, b) => b.cats - a.cats).slice(0, 3);
            const topByPrestige = [...playersData].sort((a, b) => b.prestige_level - a.prestige_level).slice(0, 3);
            
            document.getElementById('statsContent').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 16px; font-weight: bold; color: #f8c291;">
                                ${formatNumber(totalCats)}
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Всего котов</div>
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 16px; font-weight: bold; color: #4a69bd;">
                                ${formatNumber(totalMatroskin)}
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Матроскин</div>
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 16px; font-weight: bold; color: #78e08f;">
                                ${successRate}%
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Успех атак</div>
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; text-align: center;">
                            <div style="font-size: 16px; font-weight: bold; color: #e55039;">
                                ${avgPrestige}
                            </div>
                            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">Ср. престиж</div>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h4 style="color: #f8c291; margin-bottom: 12px; font-size: 16px;">
                            <i class="fas fa-crown"></i> Топ по котам
                        </h4>
                        ${topByCats.map((player, index) => `
                            <div style="
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                                padding: 12px;
                                background: rgba(255, 255, 255, 0.03);
                                border-radius: 8px;
                                margin-bottom: 8px;
                                border-left: 4px solid ${index === 0 ? '#fbbf24' : index === 1 ? '#c0c0c0' : '#cd7f32'};
                            ">
                                <div>
                                    <div style="font-weight: 600;">${player.name}</div>
                                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">${player.nickname}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-weight: bold; color: #f8c291;">${formatNumber(player.cats)}</div>
                                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">котов</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div>
                        <h4 style="color: #f8c291; margin-bottom: 12px; font-size: 16px;">
                            <i class="fas fa-trophy"></i> Топ по престижу
                        </h4>
                        ${topByPrestige.map((player, index) => `
                            <div style="
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                                padding: 12px;
                                background: rgba(255, 255, 255, 0.03);
                                border-radius: 8px;
                                margin-bottom: 8px;
                                border-left: 4px solid ${PRESTIGE_COLORS[player.prestige_level] || '#f8c291'};
                            ">
                                <div>
                                    <div style="font-weight: 600;">${player.name}</div>
                                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">${player.nickname}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-weight: bold; color: ${PRESTIGE_COLORS[player.prestige_level] || '#f8c291'}">
                                        Уровень ${player.prestige_level}
                                    </div>
                                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6);">
                                        ${player.cats} котов
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('statsModal').classList.add('active');
        }
        
        // Закрыть окно статистики
        function closeStatsModal() {
            document.getElementById('statsModal').classList.remove('active');
            tg.HapticFeedback.impactOccurred('light');
        }
        
        // Цвета для престижей
        const PRESTIGE_COLORS = {
            0: '#a5b1c2',
            1: '#78e08f',
            2: '#4a69bd',
            3: '#f8c291',
            4: '#e55039',
            5: '#8e44ad',
            6: '#f6b93b',
            7: '#38ada9',
            8: '#6a89cc',
            9: '#b8e994',
            10: '#fa983a'
        };
    </script>
</body>
</html>
